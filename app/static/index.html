<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>311 模拟考试</title>
<style>
  #timer { font-variant-numeric:tabular-nums; font-size:20px; font-weight:700; color:var(--accent); }
  #timer.warn { color:#c53030; }

  .stem { margin-bottom:8px; white-space:pre-wrap; }
  .stem .no { display:inline-block; min-width:34px; font-weight:700; color:var(--accent); }

  .subj .tag { display:inline-block; font-size:12px; padding:1px 7px; border-radius:10px;
               background:#eef3f8; color:var(--accent); margin-left:8px; }
  /* 采分点自评的样式已全部移入共用组件（/static/qa-answer.js 的 .qa-* 规则），
     本页不再保留 .pts/.pt —— 留着只会让人以为这里还在用旧的一套 */
  /* 客观题「正确答案 + 解析」（默认隐藏，提交后或点按钮才显示）—— 主观题走组件 */
  details.qans { margin-top:8px; }
  details.qans[hidden] { display:none; }
  details.qans summary { cursor:pointer; font-size:13px; color:var(--accent); }
  details.qans .explain { margin-top:6px; padding:10px 12px; background:#f7fafc;
    border-left:3px solid var(--accent); border-radius:4px; font-size:13.5px;
    white-space:pre-wrap; line-height:1.75; }

  #msg { color:var(--muted); font-size:13px; }
  #weak table { width:100%; border-collapse:collapse; font-size:13px; }
  #weak td, #weak th { border-bottom:1px solid var(--line); padding:5px 6px; text-align:left; }
  .rate-bad { color:#c53030; font-weight:700; }

  .grade { background:#f7fafc; border:1px solid var(--line); border-radius:6px;
           padding:12px; margin-top:10px; white-space:pre-wrap; font-size:14px; }

  .kp { font-size:13px; color:var(--muted); }
  .extra { background:#fffbea; border-left:3px solid #ecc94b; padding:6px 10px; margin:6px 0; font-size:13px; }
</style>
<link rel="stylesheet" href="/static/app-ui.css">
<script src="/static/app-shell.js" defer></script>
<!-- 答案解析与批改组件：四个页面共用一份实现（/static/qa-answer.js 由 server.py 提供） -->
<script src="/static/qa-answer.js"></script>
</head>
<body data-page="exam">
<header class="app-header"><nav class="app-nav" data-app-nav aria-label="主要导航">311 备考系统</nav></header>

<main>
  <div class="page-hero">
    <p class="eyebrow">模拟考试</p>
    <div class="page-heading-row"><h1>按考场节奏，完成一套练习</h1></div>
    <p class="intro">保留完整题单与作答记录。先完成作答，再展开答案、核对采分点。</p>
  </div>
  <div class="page-toolbar exam-toolbar">
    <div class="exam-clock"><span class="toolbar-caption">剩余时间</span><div id="timer">--:--</div></div>
    <div class="meta grow" id="meta">加载中…</div>
    <button class="ghost" onclick="loadWeakness()">看薄弱点</button>
    <button class="ghost" onclick="rebuild()">重新组卷</button>
  </div>

  <div id="weak" style="display:none"><section><h2>薄弱考点（按命中率升序）</h2><div id="weakBody"></div></section></div>
  <section id="secSingle"><h2>一、单项选择题</h2><div id="singles"></div></section>
  <section id="secSubj"><h2>二、主观题（在纸上作答，回来后勾选你答到的采分点）</h2><div id="subjectives"></div></section>
  <section id="result" style="display:none"><h2>提交结果</h2><div id="resultBody"></div></section>
</main>

<div class="bar exam-actions">
  <button onclick="submitAll()" id="btnSubmit">提交并保存</button>
  <button class="ghost" onclick="toggleAnswers()" id="btnAnswers">显示答案解析</button>
  <button class="ghost" onclick="location.reload()">重新开始</button>
  <span id="msg"></span>
</div>

<script>
let PAPER = null, remain = 0, timerId = null, GRADES = {};
let SAVE_BUSY = false, SAVE_LAST = null;

function submissionIdFor(fingerprint) {
  const key = 'submission_' + PAPER.paper_id;
  try {
    const old = JSON.parse(localStorage.getItem(key) || 'null');
    if (old && old.fingerprint === fingerprint && old.id) return old.id;
  } catch (e) {}
  const id = crypto.randomUUID();
  try { localStorage.setItem(key, JSON.stringify({fingerprint, id})); } catch (e) {}
  return id;
}

const fmt = s => {
  s = Math.max(0, s|0);
  const m = String(Math.floor(s/60)).padStart(2,'0');
  const q = String(s%60).padStart(2,'0');
  return m + ':' + q;
};

// 客观题的「正确答案 + 解析」：默认隐藏，提交后（或点按钮）才显示。
// 数据来自 questions.extra.explain（由 app/extract_explain.py 从真题解析文件抽取）
function qExplain(q) {
  try { return (JSON.parse(q.extra || '{}').explain) || ''; } catch (e) { return ''; }
}
function renderQAnswer(q) {
  const ex = qExplain(q);
  if (!ex) return '';
  return `<details class="qans" hidden>
      <summary>正确答案 <b>${q.answer || '—'}</b> ｜ 看解析</summary>
      <div class="explain"><b>答案：${q.answer || '—'}</b>${ex.replace(/</g,'&lt;')}</div>
    </details>`;
}
// 提交后统一放出来（客观题解析 + 主观题采分点/参考答案）
function revealAnswers() {
  QA.revealAll(document);
}
function toggleAnswers() {
  // 客观题的解析（.qans）与主观题的采分点（.qa-gate）一起管：这两个以前是两套规矩
  // （客观题默认藏、主观题默认全摊开），等于考前就能看到主观题的答案要点。
  const show = QA.anyHidden(document);
  if (show) QA.revealAll(document); else QA.hideAll(document);
  const btn = document.getElementById('btnAnswers');
  if (btn) btn.textContent = show ? '收起答案解析' : '显示答案解析';
}

// 出题设置与 /daily 共用同一个 localStorage 键（同源）：
// 这一页只有「45 道里真题不够时 AI 补的那几道」受它影响，所以不在这里放设置窗口，
// 但组卷时会读你上次在 /daily 选的难度档与思考开关。
function genSettingsQS() {
  try {
    const s = JSON.parse(localStorage.getItem('qa_gen_settings') || 'null') || {};
    const d = parseInt(s.difficulty) || 3;
    return `difficulty=${d}&thinking=${s.thinking === false ? 0 : 1}`;
  } catch (e) { return 'difficulty=3&thinking=1'; }
}

async function boot(doRebuild) {
  const qs = genSettingsQS();
  const r = await fetch('/api/paper' + (doRebuild ? '?rebuild=1&' + qs : '?' + qs));
  PAPER = await r.json();
  SAVE_BUSY = false;
  SAVE_LAST = null;
  document.getElementById('btnSubmit').disabled = false;
  window.__PAPER_ID = PAPER.paper_id;   // 暴露给调试与自动化测试（let 不会挂到 window 上）

  const c = PAPER.counts;
  document.getElementById('meta').textContent =
    `单选 ${c.single}/45 · 辨析 ${c.analysis}/3 · 简答 ${c.short}/5 · 论述 ${c.essay}/3` +
    ` ｜ 真题 ${c.real} 题，AI 生成 ${c.ai} 题`;

  const s = document.getElementById('singles');
  s.innerHTML = PAPER.singles.map((q, i) => `
    <div class="q">
      <div class="stem"><span class="no">${i + 1}.</span>${q.stem}
        <span class="meta" style="font-size:12px">[${q.year || 'AI'}${q.number ? ' 原' + q.number + '题' : ''}]</span></div>
      ${Object.entries(q.options).map(([k,v]) => `
        <label class="opt"><input type="radio" name="q${q.id}" value="${k}"><b>${k}.</b> ${v}</label>
      `).join('')}
      ${renderQAnswer(q)}
    </div>`).join('');

  const t = document.getElementById('subjectives');
  t.innerHTML = PAPER.subjectives.map((q, i) => {
    const typeName = {analysis:'辨析', short:'简答', essay:'分析论述'}[q.qtype] || q.qtype;
    const srcTag = q.year ? `${q.year}真题` : 'AI生成';
    return `
    <div class="q subj">
      <div class="stem">
        <span class="no">${i + 1}.</span>${q.stem}
        <span class="tag">${typeName} · ${q.full_score}分</span>
        <span class="tag ${q.year ? 'real' : 'ai'}">${srcTag}</span>
      </div>
      ${QA.render(q, {pick: true, gated: true, title: `${typeName}题`})}
      ${QA.renderWork(q)}
      <select class="cause" data-cause="${q.id}">
        <option value="">错因（可选）</option>
        <option>不会</option><option>记混</option><option>看漏条件</option><option>时间不够</option>
      </select>
    </div>`;
  }).join('');

  QA.bind(document);

  // 计时：从「首次打开这份卷子」开始算，刷新页面不重置
  const tkey = 'started_' + PAPER.paper_id;
  let started = parseInt(localStorage.getItem(tkey) || '0', 10);
  if (!started) { started = Date.now(); localStorage.setItem(tkey, started); }
  const elapsed = Math.floor((Date.now() - started) / 1000);
  remain = Math.max(0, (PAPER.minutes || 180) * 60 - elapsed);
  tick();
  if (timerId) clearInterval(timerId);
  timerId = setInterval(tick, 1000);

  bindDraft();
}

// ===== 作答收集 / 草稿：存浏览器本地，关掉页面刷新都不丢 =====
// 输出格式与 /api/save 的请求体一致，草稿与提交共用同一份结构
function collectPaper() {
  const single = [];
  document.querySelectorAll('#singles input[type=radio]:checked').forEach(i => {
    single.push({ id: parseInt(i.name.slice(1)), answer: i.value });
  });
  const map = {};
  // 采分点勾选由共用组件渲染（.qa 块），选择器跟着改 —— 只改一处，两个页面共用
  document.querySelectorAll('#subjectives .qa input[type=checkbox][data-q]:checked').forEach(i => {
    const q = parseInt(i.dataset.q);
    (map[q] = map[q] || []).push(parseInt(i.value));
  });
  // 来源与所选分支（勾选 / 采纳 AI 建议 / 0 点自评 都会写进题目块的 data-model）
  const sources = QA.collectSources(document);
  const options = QA.collectOptions(document);
  // 人工确认（设计 §5/D）：只提交"我确认过"这个意图，盖章与对账重算在服务端做
  const overrides = QA.collectOverrides(document);
  // **0 点命中的自评也要入 map**：否则"我自评了、一个点都没答到"会被当成没做这题
  Object.keys(sources).forEach(k => { map[k] = map[k] || []; });
  document.querySelectorAll('#subjectives select[data-cause]').forEach(s => {
    const q = parseInt(s.dataset.cause);
    if (s.value) { map[q] = map[q] || []; map[q].cause = s.value; }
  });
  // 作答原文与 AI 批改结果跟着一起提交：练习日志要展开显示"我写了什么、批得怎么样"。
  // 一道题哪怕一个采分点都没勾，只要写了原文或批过，也算"做过的题"——
  // 否则它在日志里根本不会出现（只勾采分点才入 map 的话就会漏）。
  document.querySelectorAll('#subjectives textarea[id^="ans-"]').forEach(ta => {
    const q = parseInt(ta.id.slice(4));
    const v = (ta.value || '').trim();
    if (v) { map[q] = map[q] || []; map[q].answer_text = v; }
  });
  Object.keys(GRADES).forEach(k => {
    const q = parseInt(k);
    if (GRADES[k]) { map[q] = map[q] || []; map[q].grade = GRADES[k]; }
  });
  const subjective = Object.entries(map).map(([id, v]) => ({
    id: parseInt(id),
    hits: Array.isArray(v) ? v : [],
    cause: (v && v.cause) || null,
    answer_text: (v && v.answer_text) || null,
    grade: (v && v.grade) || null,
    point_source: sources[id] || null,
    selected_option: options[id] || null,
    grade_override: overrides[id] === true,
  }));
  return { single, subjective, ts: Date.now() };
}

function saveDraft() {
  if (!PAPER || !PAPER.paper_id) return;
  try {
    localStorage.setItem('draft_' + PAPER.paper_id, JSON.stringify(collectPaper()));
    const m = document.getElementById('msg');
    if (m) m.textContent = '作答草稿已自动保存（刷新不丢）';
  } catch (e) {}
}

function restoreDraft() {
  if (!PAPER || !PAPER.paper_id) return 0;
  let d = null;
  try { d = JSON.parse(localStorage.getItem('draft_' + PAPER.paper_id) || 'null'); } catch (e) { return 0; }
  if (!d) return 0;
  let n = 0;
  (d.single || []).forEach(x => {
    const el = document.querySelector(`input[name="q${x.id}"][value="${x.answer}"]`);
    if (el) { el.checked = true; n++; }
  });
  (d.subjective || []).forEach(x => {
    (x.hits || []).forEach(seq => {
      // 采分点由共用组件渲染（.qa[data-qid] 里的复选框）。
      // 选择器跟着组件改 —— 以前是 `#pts-{id} input[value=seq]`，
      // 组件换掉之后它就**永远查不到**，草稿里的勾选静默丢失（刷新后全没了，
      // 而且只表现为"提示已恢复 0 处"，不看断言发现不了）。
      const el = document.querySelector(`.qa[data-qid="${x.id}"] input[data-seq="${seq}"]`);
      if (el) { el.checked = true; n++; }
    });
    if (x.cause) {
      const sel = document.querySelector(`select[data-cause="${x.id}"]`);
      if (sel) sel.value = x.cause;
    }
    // 作答原文此前不进草稿也不进库，刷新一次就白写了 —— 现在一并还原
    if (x.answer_text) {
      const ta = document.getElementById('ans-' + x.id);
      if (ta) { ta.value = x.answer_text; n++; }
    }
    // 结果来源与所选分支也要还原：草稿里存了"用户已自评/已采纳 AI 建议"，
    // 刷新后不还原的话，提交时来源会退回未评定 —— 文件没变、结果却变了。
    if (x.point_source) QA.setSource(x.id, x.point_source);
    // 人工确认（设计 §5/D）同样要还原：草稿里勾了"我确认过"，刷新后不还原就等于没确认
    if (x.grade_override) QA.setOverride(x.id, true);
    if (x.selected_option) {
      const r = document.querySelector(`input[data-opt="${x.id}"][value="${x.selected_option}"]`);
      if (r) { r.checked = true; QA.setOption(x.id, x.selected_option); }
    }
  });
  // 勾选是直接改 DOM 的，分数条不会自己更新 —— 手工刷一次
  document.querySelectorAll('.qa input[type=checkbox][data-q]:checked')
    .forEach(cb => QA.refreshScore(cb));
  // 草稿里恢复出勾选/原文/来源的题，把它的答案折叠门也打开：那些题的答案你本来就看过，
  // 不然刷新后它们看着是"空白"，顶部却显示已得 8 分（状态其实恢复了，只是折着）
  (d.subjective || []).forEach(x => {
    if (!(x.hits || []).length && !x.answer_text && !x.point_source && !x.grade_override) return;
    const gate = document.querySelector(`.qa[data-qid="${x.id}"] details.qa-gate`);
    if (gate) gate.open = true;
  });
  return n;
}

function bindDraft() {
  const restored = restoreDraft();
  // 注意：容器是 #singles / #subjectives，没有 #paper 元素（早期笔误导致事件绑定失效）
  const scope = '#singles input, #subjectives input, #subjectives select';
  document.querySelectorAll(scope).forEach(el => el.addEventListener('change', saveDraft));
  if (restored) {
    const m = document.getElementById('msg');
    if (m) m.textContent = `已恢复上次未提交的作答（${restored} 处）`;
  }
}

function tick() {
  const el = document.getElementById('timer');
  el.textContent = fmt(remain);
  el.classList.toggle('warn', remain <= 15*60);
  if (remain <= 0) { clearInterval(timerId); el.textContent = '时间到'; }
  remain--;
}

function collect() {
  const single = [];
  document.querySelectorAll('#singles input[type=radio]:checked').forEach(i => {
    single.push({ id: parseInt(i.name.slice(1)), answer: i.value });
  });
  const map = {};
  document.querySelectorAll('#subjectives input[type=checkbox]:checked').forEach(i => {
    const q = parseInt(i.dataset.q);
    (map[q] = map[q] || []).push(parseInt(i.value));
  });
  document.querySelectorAll('#subjectives select[data-cause]').forEach(s => {
    const q = parseInt(s.dataset.cause);
    if (s.value) { map[q] = map[q] || []; if (!map[q].cause) map[q].cause = s.value; }
  });
  const subjective = Object.entries(map).map(([id, v]) => ({
    id: parseInt(id),
    hits: Array.isArray(v) ? v : [],
    cause: v.cause || null
  }));
  return { single, subjective };
}

// ===== 本次发的整份卷子的题目 id（含没作答的）=====
// 练习日志要显示"这一次练的全部题目，包括没做的"：只靠 attempts 是做不到的
// —— 没作答的题在库里没有任何行。所以在提交时把整份卷子的题目 id 一起送上去，
// 日志才知道这次到底发了哪些题、哪几道是空着的。
function paperQuestionIds() {
  const p = PAPER || {};
  return [...(p.singles || []), ...(p.subjectives || [])]
    .map(q => q && q.id).filter(id => id);
}

async function submitAll() {
  if (SAVE_BUSY) return;
  const body = collectPaper();
  delete body.ts;
  body.date = new Date().toISOString().slice(0,10);
  body.mode = '模拟考试';
  body.question_ids = paperQuestionIds();
  body.note = `本轮试卷：单选 ${PAPER.counts.single} · 主观 ${PAPER.counts.subjective}（真题 ${PAPER.counts.real} / AI ${PAPER.counts.ai}）`;
  const fingerprint = JSON.stringify(body);
  if (SAVE_LAST === fingerprint) {
    document.getElementById('msg').textContent = '这份作答已经保存。';
    return;
  }
  body.submission_id = submissionIdFor(fingerprint);
  SAVE_BUSY = true;
  document.getElementById('btnSubmit').disabled = true;
  document.getElementById('msg').textContent = '保存中…';
  try {
    const r = await fetch('/api/save', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    const j = await r.json();
    if (!r.ok || !j.ok) throw new Error(j.error || '保存失败');
    const rb = document.getElementById('resultBody');
    rb.innerHTML = `<p style="font-size:22px;margin:4px 0"><b>客观题得分：${j.saved.single_score} / 90 分</b>
      <span style="font-size:14px;color:#777">（答对 ${j.saved.single_right} / ${j.saved.single} 题，每题 2 分）</span></p>
    <p style="color:#777;font-size:13px">日期 ${j.date} ｜ 主观题 ${j.saved.subjective} 题${
      j.saved.unconfirmed ? `（其中 <b>${j.saved.unconfirmed} 题只收到 AI 建议、未采纳</b>，不计入掌握率）` : ''} ｜ 记录采分点命中 ${j.saved.point_hits} 个</p>
    <p style="font-size:18px">${QA.practiceScoreText(j.saved)}</p>
    <p style="font-size:13px">成绩优先采用通过对账的 AI 详细批改实得分，无需自评勾选。
      点「采用 AI 建议」或自己勾采分点才算确认（才计入掌握率）。一题都没答到就点「0 点命中，完成自评」。</p>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px">
      <button onclick="genReview(${j.saved.session_id || 'null'}, this)">生成 AI 学习复盘</button>
      <span style="font-size:13px;color:#777" id="reviewMsg">基于本次作答 + 历史记录出一份学习报告</span>
    </div>`;
    document.getElementById('result').style.display = 'block';
    // 提交后自动放出答案；展示成功后再清草稿，避免页面渲染出错时无法重试。
    try { revealAnswers(); } catch (e) {}
    SAVE_LAST = fingerprint;
    document.getElementById('msg').textContent = '已保存';
    try {
      localStorage.removeItem('draft_' + PAPER.paper_id);
      localStorage.removeItem('started_' + PAPER.paper_id);
    } catch (e) {}
  } catch (e) {
    document.getElementById('msg').textContent = '保存失败：' + e.message;
  } finally {
    SAVE_BUSY = false;
    document.getElementById('btnSubmit').disabled = false;
  }
}

async function genReview(sid, btn) {
  const msg = document.getElementById('reviewMsg');
  if (!sid) { msg.textContent = '这次没拿到练习记录 id，去「学习复盘」页手动生成。'; return; }
  btn.disabled = true;
  msg.textContent = 'AI 分析中…（约 10–20 秒）';
  try {
    const r = await fetch('/api/review/generate', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ session_id: sid })
    });
    const j = await r.json();
    if (!j.ok) { msg.textContent = '失败：' + (j.error || '未知错误'); return; }
    const u = j.usage_info || j.usage || {};
    msg.innerHTML = `报告已生成（${QA.usageText(u)}）
      → <a href="/reports" style="color:var(--accent)">去「学习复盘」看</a>`;
  } catch (e) {
    msg.textContent = '出错：' + e;
  } finally {
    btn.disabled = false;
  }
}

// ===== 主观题的批改与展示全部走共用组件 /static/qa-answer.js =====
// 为什么不再在本页写一遍：以前 / 和 /daily 各写一遍，改一个字段要改两处，
// 漏一处**不报错**、只是标签静默失效（README 里记着这个坑）。
// 批改完成后组件会派发 qa-graded 事件，这里只负责把结果收进 GRADES（提交时入库）。
window.addEventListener('qa-graded', e => {
  GRADES[e.detail.qid] = e.detail.result;
});

async function loadWeakness() {
  const r = await fetch('/api/weakness');
  const j = await r.json();
  const box = document.getElementById('weakBody');
  if (!j.items || !j.items.length) {
    box.innerHTML = '<p style="color:#777">还没有数据——先做一次模拟并提交。</p>';
  } else {
    const s = j.summary || {};
    box.innerHTML = `<p class="meta">共 ${s.nodes||0} 个考点有数据，其中命中率低于 60% 的 ${s.weak_nodes||0} 个</p>
      <table><tr><th>考点</th><th>命中/总</th><th>命中率</th></tr>` +
      j.items.map(i => `<tr><td title="${i.path}">${i.level === 'point' ? i.name.replace(/^\d+\.\s*/, '').slice(0, 26) : i.name}</td>
        <td>${i.hit_n}/${i.total_n}</td>
        <td class="${i.rate < 0.6 ? 'rate-bad':''}">${(i.rate*100).toFixed(0)}%</td></tr>`).join('') +
      `</table>`;
  }
  document.getElementById('weak').style.display = 'block';
  // 之前这里只设 display，面板出现在页面顶端而用户正看题目区，
  // 造成「点了没反应」的错觉。必须滚动过去。
  document.getElementById('weak').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function rebuild() {
  if (!confirm('重新组卷会换一整套题（真题随机抽取 + AI 补足）。\n\n当前这份试卷会被归档，未提交的作答会丢失（草稿也会一并清除）。\n继续？')) return;
  localStorage.removeItem('draft_' + (PAPER && PAPER.paper_id));
  document.getElementById('meta').textContent = '重新组卷中…（AI 补题可能需 30–60 秒）';
  document.getElementById('weak').style.display = 'none';
  document.getElementById('result').style.display = 'none';
  await boot(true);
}

boot();
</script>
