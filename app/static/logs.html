<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>311 练习日志</title>
<style>
  .sum b { font-size:20px; }

  .item .tags { font-size:13px; color:var(--muted); margin-bottom:8px; }

  .tag.sim { background:#fdf3e7; color:#b7791f; }
  .tag.ok { background:#e8f5ec; color:var(--ok); }
  .tag.bad { background:#fdecec; color:var(--bad); }
  .tag.pending { background:#f5f5f5; color:#666; }
  .tag.blank { background:#f0f0f0; color:#888; border:1px dashed #d0d0d0; }

  .rate-bad { color:var(--bad); font-weight:700; }

  /* ===== 展开后的题目明细 ===== */
  details.qbox { margin-top:10px; border-top:1px dashed var(--line); padding-top:8px; }
  details.qbox > summary { font-size:14px; font-weight:600; }
  .qbody { margin-top:10px; }
  .group { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:12px;
           background:#fcfcfd; }
  .ghead { display:flex; align-items:center; gap:8px; flex-wrap:wrap;
           border-bottom:1px solid var(--line); padding-bottom:8px; margin-bottom:8px; }
  .ghead .grow { flex:1; }
  .q { border-left:3px solid #cbd5e0; padding:8px 0 8px 10px; margin:10px 0; }
  .q.right { border-left-color:#9ae6b4; }
  .q.wrong { border-left-color:#feb2b2; }
  .q.missing { border-left-color:#ecc94b; background:#fffbea; padding-right:8px; border-radius:0 6px 6px 0; }
  .q.blank { border-left-color:#e2e8f0; background:#fcfcfd; padding-right:8px; border-radius:0 6px 6px 0; }
  .qhead { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13px; margin-bottom:4px; }
  .qno { font-weight:600; }
  .stem { font-size:14px; margin:4px 0 6px; white-space:pre-wrap; }
  .opt { font-size:13px; padding:1px 6px; border-radius:4px; color:#444; }
  .opt.right { background:#e8f5ec; color:var(--ok); font-weight:600; }
  .opt.picked { background:#eef3f8; }
  .opt.picked.right { background:#e8f5ec; }
  .mine { font-size:13px; margin-top:6px; }
  .mine .lbl { color:var(--muted); }
  .ans { background:#fff; border:1px solid var(--line); border-radius:6px; padding:6px 10px;
         margin-top:3px; white-space:pre-wrap; font-size:13px; }
  .verdict { font-size:13px; margin-top:4px; }
  .bad { color:var(--bad); font-weight:600; }
  .good { color:var(--ok); font-weight:600; }
  .grade { background:#f7fafc; border:1px solid var(--line); border-radius:6px;
           padding:8px 12px; margin-top:6px; font-size:13px; }
  details.pts, details.src { margin-top:6px; }
  .pt { padding:3px 0; font-size:13px; }
  .pt.hit { color:var(--ok); }
  .pt .mark { font-size:12px; margin-left:4px; }
  .ev { color:var(--muted); font-size:12px; }

  .hl { outline:2px solid #ecc94b; outline-offset:2px; }
</style>
<link rel="stylesheet" href="/static/app-ui.css">
<script src="/static/app-shell.js" defer></script>
<!-- 答案解析与批改组件：四个页面共用一份实现（/static/qa-answer.js 由 server.py 提供） -->
<script src="/static/qa-answer.js"></script>
</head>
<body data-page="logs">
<header class="app-header"><nav class="app-nav" data-app-nav aria-label="主要导航">311 备考系统</nav></header>
<main>
  <div class="page-hero">
    <p class="eyebrow">练习日志</p>
    <div class="page-heading-row"><h1>看清每次练了什么</h1></div>
    <p class="intro">回看完整题单、作答原文与批改，也可以继续完成上次留下的题。</p>
    <div class="page-meta" id="meta"></div>
  </div>

  <div class="sum" id="sum"></div>
  <div id="list"></div>
</main>
<script>
const $ = id => document.getElementById(id);
// 题干/作答/批改文本全部来自题库或 AI，一律转义后再拼进 HTML（曾经裸拼，题干里的 < 会吃掉标签）
const esc = s => (s === null || s === undefined ? '' : String(s))
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

// 从复盘页跳过来：/logs?date=2026-09-16&sid=1
const QS = new URLSearchParams(location.search);
const FOCUS_DATE = QS.get('date');
const FOCUS_SID = QS.get('sid');

function pct(a, b) { return b ? Math.round(a / b * 100) + '%' : '—'; }

// ============================== 列表（按天） ==============================
async function boot() {
  const j = await (await fetch('/api/logs?limit=200')).json();
  const days = j.days || [], s = j.summary || {};
  if (!days.length) {
    $('sum').style.display = 'none';
    $('list').innerHTML = '<div class="empty">还没有记录。<br>去做一次模拟或日常练习，提交后这里就会出现。</div>';
    return;
  }
  $('sum').style.display = 'block';
  $('meta').textContent = `共 ${s.days} 天 ｜ ${s.sessions} 次练习`;
  $('sum').innerHTML = `
    <div style="font-size:14px;font-weight:600">总览</div>
    <div class="kpi">
      <div>练习天数<b>${s.days || 0}</b></div>
      <div>练习次数<b>${s.sessions || 0}</b></div>
      <div>已生成报告<b>${s.reports || 0}</b></div>
      <div>待生成报告<b>${s.pending || 0}</b></div>
      <div>累计作答<b>${s.attempts || 0}</b></div>
      <div>其中没做<b>${s.unanswered || 0}</b></div>
      <div>题单累计<b>${s.questions || s.attempts || 0}</b></div>
      <div>客观题累计<b>${s.objective_score || 0}</b> 分</div>
    </div>
    <div style="font-size:13px;color:#777;margin-top:8px">
      展开某一天，能看到当天<b>发过的每一道题</b>：题干要求、你的作答、批改情况；
      <b>这一组里没作答的题也会列出来</b>（标着「未作答」，可对照正确答案与解析）。
      每道题都能直接生成或查看这一次的 AI 复盘。
      <br><b>没做完的可以接着做</b>：每组练习右上角有「继续练习」——
      载入那一次的整份卷子（没作答的补做、做过的带上次答案可改），
      提交后新建一条「续练」记录，原来那次练习不会被改动。
    </div>`;

  $('list').innerHTML = days.map((d, idx) => {
    const t = d.totals || {};
    const total = d.questions_n || d.attempts_n || 0;
    const blank = d.unanswered_n || 0;
    return `
    <div class="item">
      <h3>#${days.length - idx} ${esc(d.date)}
        <span class="tag ${d.sessions_n ? '' : 'pending'}">${d.sessions_n} 组练习</span>
        ${t.reports ? `<span class="tag ok">已生成报告 ${t.reports}</span>` : ''}
        ${d.loose_attempts ? `<span class="tag pending">另有 ${d.loose_attempts} 道早期记录</span>` : ''}
      </h3>
      <div class="tags">
        客观题 <span class="score">${t.objective_score || 0}</span> / ${(t.objective_total || 0) * 2} 分
        （对 ${t.objective_right || 0}/${t.objective_total || 0}，${pct(t.objective_right || 0, t.objective_total || 0)}）
        ｜ ${t.subjective_scored_n ? `主观题 ${t.subjective_score} / ${t.subjective_full} 分（AI 详细批改优先）`
          : QA.subjectiveStateText({n: t.subjective_count || 0, unscored_kinds: t.unscored_kinds})}
        ${t.point_total ? `｜ 采分点命中 ${t.point_hits || 0}/${t.point_total}` : ''}
        ｜ 共 ${total} 道题${blank ? `（含 ${blank} 道没作答）` : ''}
      </div>
      <details class="qbox" data-date="${esc(d.date)}">
        <summary>展开这一天的全部题目（${total} 道${blank ? `，含 ${blank} 道未作答` : ''}）</summary>
        <div class="qbody"><div class="muted" style="padding:10px 0">点开即加载…</div></div>
      </details>
    </div>`;
  }).join('');

  document.querySelectorAll('details.qbox').forEach(box => {
    box.addEventListener('toggle', () => {
      if (box.open) loadDay(box.dataset.date, box.querySelector('.qbody'));
    });
  });

  // 从复盘页跳过来：自动展开那一天、并高亮那一次练习
  if (FOCUS_DATE) {
    const box = document.querySelector(`details.qbox[data-date="${FOCUS_DATE}"]`);
    if (box) {
      box.open = true;
      box.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }
}

// ============================== 某一天的明细 ==============================
async function loadDay(date, body) {
  if (!body) return;
  body.innerHTML = '<div class="muted" style="padding:10px 0">加载中…</div>';
  let j;
  try {
    j = await (await fetch('/api/logs/day/' + encodeURIComponent(date))).json();
  } catch (e) {
    body.innerHTML = `<div class="muted">加载失败：${esc(e)}</div>`;
    return;
  }
  const groups = j.groups || [];
  if (!groups.length) {
    body.innerHTML = '<div class="muted" style="padding:10px 0">这一天没有作答记录。</div>';
    return;
  }
  body.innerHTML = groups.map(g => renderGroup(g, date)).join('')
    + (j.unanswered_n ? `<div class="muted">注：这天有 <b>${j.unanswered_n} 道题没作答</b>，
        它们仍然列在上面（标着「未作答」），方便对照答案与解析。</div>` : '')
    + (j.missing_n ? `<div class="muted">注：其中有 ${j.missing_n} 道题已不在题库里（题库重建过），
        只保留了作答记录。</div>` : '');

  // 高亮复盘页指向的那一次练习
  if (FOCUS_SID) {
    const el = document.getElementById('g-' + FOCUS_SID);
    if (el) { el.classList.add('hl'); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  }
}

// 主观题折合分 + 来源：与服务端 `attempt_score()` 同一口径（后端算好，这里只显示）。
// 只给折合分（不区分来源）会把"用户确认过的"和"来源不明的旧记录"混成一条成绩线。
const SRC_TXT = {
  ai_graded: 'AI 详细批改实得分',
  mixed_ai: 'AI 详细批改优先，其余按采分点折合',
  confirmed: '你确认过的采分点',
  legacy_unknown: '来源不明（旧记录）',
  mixed: '含旧来源不明记录'
};
function subjLine(s) {
  if (!s || !s.subjective_count) return '';
  if (!s.subjective_full) {
    // 原因要说准：已自评但分值待核 ≠ 尚未评定（复审问题 3），措辞在共用组件里
    return '｜ ' + QA.subjectiveStateText({n: s.subjective_count, unscored_kinds: s.unscored_kinds});
  }
  const bits = [`｜ 主观题 <span class="score">${s.subjective_score}</span> / ${s.subjective_full} 分`];
  const src = SRC_TXT[s.subjective_source];
  if (src) bits.push(`<span class="muted">（${src}）</span>`);
  if (s.subjective_unscored_n) {
    bits.push(`<span class="muted">· 另有 ${s.subjective_unscored_n} 道未评定/分值待核</span>`);
  }
  return bits.join(' ');
}

function renderGroup(g, date) {
  const s = g.summary || {};
  const title = g.loose ? '未归属记录' : (g.mode || '未标注');
  const total = g.questions_n || (g.questions || []).length;
  const blank = g.unanswered_n || 0;
  return `
  <div class="group" id="g-${g.session_id ?? 'loose'}">
    <div class="ghead">
      <span class="tag ${title.includes('模拟') ? 'sim' : ''}">${esc(title)}</span>
      <span class="muted">
        ${s.objective_total ? `客观 ${s.objective_score}/${s.objective_total * 2} 分（对 ${s.objective_right}/${s.objective_total}）` : ''}
        ${s.subjective_count ? `｜ 主观 ${s.subjective_count} 题` : ''}
        ${subjLine(s)}
        ${s.point_total ? `｜ 采分点命中 ${s.point_hits}/${s.point_total}` : ''}
        ｜ 共 ${total} 道题${blank ? `，其中 <b>${blank} 道未作答</b>` : ''}
        ${g.created_at ? `｜ 提交于 ${esc((g.created_at || '').replace('T', ' '))}` : ''}
      </span>
      <span class="grow"></span>
      ${resumeRow(g)}
      ${reportRow(g)}
    </div>
    ${g.note ? `<div class="muted" style="margin-bottom:6px">备注：${esc(g.note)}</div>` : ''}
    ${g.has_question_set === false ? `<div class="muted" style="margin-bottom:6px">
        这次练习没有记下完整题单（功能上线前的旧记录），所以下面只列你做过的题。</div>` : ''}
    ${(g.questions || []).map(renderQuestion).join('')}
  </div>`;
}

/**
 * 「继续练习」：把这一次练习的**整份原题**重新载入答题页（`/daily?continue=<sid>`），
 * 没作答的题补做、已作答的带上次答案（可改）；提交时只记新做/改动过的题，新建一条「续练」记录。
 *
 * 三种状态都要有明确说法 —— 按钮直接消失会让人以为功能坏了（"上次明明有"）：
 *   有未作答的题 → 可点（写明几道没做）；这次全做完了 → 置灰说明；旧记录没有题单 → 置灰说明原因。
 */
function resumeRow(g) {
  if (g.loose || !g.session_id) {
    return '<span class="muted">早期直接入库的作答，没有对应的练习记录</span>';
  }
  if (g.has_question_set === false) {
    return `<button class="btn mini" disabled>继续练习</button>
            <span class="muted">这次没记下完整题单（功能上线前的旧记录），续练不了</span>`;
  }
  if (!g.unanswered_n) {
    return `<button class="btn mini" disabled>继续练习</button>
            <span class="muted">这次全做完了</span>`;
  }
  return `<a class="btn mini" target="_blank" rel="noopener" href="/daily?continue=${g.session_id}"
      title="载入这一次的整份卷子：没作答的题补做，已作答的带上次答案（可改）"
      >继续练习（${g.unanswered_n} 道未做）</a>`;
}

// 与「学习复盘」板块的联动入口：已生成 → 去看；没生成 → 就地生成
function reportRow(g) {
  if (g.loose) {
    return '<span class="muted">早期直接入库的作答，没有对应的练习记录</span>';
  }
  if (g.report_id) {
    return `<a class="btn ghost mini" href="/reports#rep-${g.report_id}">查看复盘报告</a>
            <button class="btn ghost mini" onclick="genReview(${g.session_id}, this)">重新生成</button>`;
  }
  return `<button class="btn mini" onclick="genReview(${g.session_id}, this)">生成 AI 复盘</button>
          <span class="muted">基于这次作答 + 历史记录</span>`;
}

async function genReview(sid, btn) {
  if (!sid) return;
  btn.disabled = true;
  btn.textContent = 'AI 分析中…（约 10-20 秒）';
  try {
    const r = await fetch('/api/review/generate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sid })
    });
    const j = await r.json();
    if (!j.ok) {
      alert('生成失败：' + (j.error || '未知错误'));
      btn.disabled = false; btn.textContent = '生成 AI 复盘';
      return;
    }
    // 重新渲染列表，展开过的天照旧展开，并跳到刚生成的报告
    location.href = '/reports#rep-' + j.report_id;
  } catch (e) {
    alert('出错：' + e);
    btn.disabled = false; btn.textContent = '生成 AI 复盘';
  }
}

// ============================== 单题渲染 ==============================
// 「这一次发了这道题、但没作答」：后端用 answered=false 标出（老接口还有 unanswered 写法）。
// 注意别只看一个字段名就下判断 —— 字段名不一致会让整块样式静默失效（页面上看不出来）。
const isBlank = q => q.answered === false || q.unanswered === true;

function renderQuestion(q) {
  if (q.missing) {
    return `<div class="q missing">
      <div class="qhead"><span class="tag bad">题目已不在题库</span>
        <span class="muted">题库里已找不到这道题（id=${q.question_id}）｜作答记录仍然保留</span></div>
      ${q.my_answer ? `<div class="mine"><span class="lbl">我的作答：</span><b>${esc(q.my_answer)}</b></div>` : ''}
    </div>`;
  }
  // 没作答的题也走同一条渲染路径（题干/选项/正确答案/解析照给），只是不显示我的作答与判分
  return q.qtype === 'single' ? renderSingle(q) : renderSubjective(q);
}

function qheadHtml(q) {
  const right = q.is_right === true ? 'right' : (q.is_right === false ? 'wrong' : '');
  const verdict = q.is_right === true
    ? `<span class="tag ok">✔ 答对 ${q.score}/${q.full_score}</span>`
    : (q.is_right === false ? `<span class="tag bad">✘ 答错 ${q.score}/${q.full_score}</span>` : '');
  return { cls: right, html: `
    <div class="qhead">
      <span class="tag">${esc(q.qtype_label)}</span>
      ${q.number ? `<span class="qno">第 ${esc(q.number)} 题</span>` : ''}
      ${q.year ? `<span class="tag">${q.year} 真题</span>` : ''}
      ${q.source && q.source.includes('AI') ? '<span class="tag sim">AI 生成</span>' : ''}
      ${isBlank(q) ? '<span class="tag blank">未作答</span>' : ''}
      ${verdict}
      ${q.outline_name ? `<span class="muted">考点：${esc(q.outline_name)}</span>` : ''}
    </div>` };
}

function renderSingle(q) {
  const h = qheadHtml(q);
  return `<div class="q ${isBlank(q) ? 'blank' : h.cls}">${h.html}${QA.renderReview(q)}</div>`;
}

function renderSubjective(q) {
  const h = qheadHtml(q);
  return `<div class="q ${isBlank(q) ? 'blank' : ''}">${h.html}
    ${q.cause && !isBlank(q) ? `<div class="verdict"><span class="lbl">已保存错因：</span><b>${esc(q.cause)}</b></div>` : ''}
    ${QA.renderReview(q)}</div>`;
}

boot();
</script>
</body>
</html>
