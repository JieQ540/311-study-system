<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>311 学习复盘</title>
<style>
  :root { --line:#e3e3e3; --ink:#222; --muted:#777; --accent:#2b6cb0; --ok:#2f855a; --bad:#c53030; --bg:#fafafa; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
         color:var(--ink); background:var(--bg); line-height:1.75; }
  header { position:sticky; top:0; z-index:9; background:#fff; border-bottom:1px solid var(--line);
           padding:10px 18px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header a { color:var(--accent); text-decoration:none; font-size:13px; }
  main { max-width:900px; margin:0 auto; padding:18px; }
  .sum { background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px 18px; margin-bottom:16px; }
  .sum .kpi { display:flex; gap:26px; flex-wrap:wrap; margin-top:6px; }
  .sum .kpi div { font-size:13px; color:var(--muted); }
  .sum .kpi b { display:block; font-size:21px; color:var(--ink); }
  .note { background:#fffbea; border-left:3px solid #ecc94b; padding:10px 14px; border-radius:6px;
          font-size:13px; margin-bottom:16px; }
  .item { background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px 18px; margin-bottom:12px; }
  .item h3 { margin:0 0 6px; font-size:15px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .tags { font-size:13px; color:var(--muted); margin-bottom:8px; }
  .tag { display:inline-block; font-size:12px; padding:1px 8px; border-radius:10px;
         background:#eef3f8; color:var(--accent); margin-right:6px; }
  .tag.sim { background:#fdf3e7; color:#b7791f; }
  .tag.pending { background:#fdecec; color:var(--bad); }
  .tag.done { background:#e8f5ec; color:var(--ok); }
  .score { font-size:17px; font-weight:700; color:var(--accent); }
  button { font-size:14px; padding:7px 16px; border-radius:6px; border:1px solid var(--accent);
           background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.ghost { background:#fff; color:var(--accent); }
  button.danger { background:#fff; border-color:#e6b8b8; color:var(--bad); }
  button.mini { font-size:12px; padding:4px 10px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:10px; }
  .muted { color:var(--muted); font-size:13px; }
  /* 趋势图：纯 CSS 柱状图，不引图表库 */
  .chart { display:flex; align-items:flex-end; gap:8px; height:150px; padding:10px 4px 0;
           border-bottom:1px solid var(--line); overflow-x:auto; }
  .bar { flex:0 0 44px; display:flex; flex-direction:column; justify-content:flex-end;
         align-items:center; height:100%; }
  .bar .fill { width:26px; background:var(--accent); border-radius:3px 3px 0 0; min-height:2px; }
  .bar .fill.bad { background:#e57373; }
  .bar .v { font-size:11px; color:var(--muted); margin-bottom:3px; }
  .bar .d { font-size:10px; color:var(--muted); white-space:nowrap; }
  .report { background:#f7fafc; border:1px solid var(--line); border-radius:6px;
            padding:12px 16px; margin-top:10px; font-size:14px; }
  .report h1, .report h2, .report h3 { font-size:14px; margin:12px 0 6px; }
  .report p { margin:6px 0; }
  .report ul { margin:6px 0 6px 20px; padding:0; }
  .report li { margin:3px 0; }
  .report strong { color:#1a365d; }
  table { width:100%; border-collapse:collapse; font-size:13px; margin-top:6px; }
  td, th { border-bottom:1px solid #f0f0f0; padding:3px 6px; text-align:left; }
  .rate-bad { color:var(--bad); font-weight:700; }
  details summary { cursor:pointer; font-size:13px; color:var(--accent); }
  .empty { color:var(--muted); text-align:center; padding:40px; background:#fff;
           border:1px solid var(--line); border-radius:8px; }
</style>
</head>
<body>
<header>
  <h1>311 学习复盘</h1>
  <a href="/">← 模拟考试</a>
  <a href="/daily">← 日常练习</a>
  <a href="/logs">练习日志</a>
  <div style="flex:1"></div>
  <span class="muted" id="meta"></span>
</header>
<main>
  <div class="sum" id="sum"></div>
  <div id="chartBox"></div>
  <div id="list"></div>
</main>
<script>
const $ = id => document.getElementById(id);

// 极简 Markdown → HTML（只支持标题/加粗/列表/段落，够报告用；不引第三方库）
function esc(s) {
  return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function md(text) {
  const lines = esc(text || '').split(/\r?\n/);
  let out = [], inUl = false, inOl = false;
  const closeList = () => {
    if (inUl) { out.push('</ul>'); inUl = false; }
    if (inOl) { out.push('</ol>'); inOl = false; }
  };
  for (let raw of lines) {
    const line = raw.trim();
    if (!line) { closeList(); continue; }
    let m;
    if ((m = line.match(/^(#{1,6})\s*(.+)$/))) {
      closeList();
      const lv = Math.min(m[1].length + 1, 4);
      out.push(`<h${lv}>${m[2]}</h${lv}>`);
    } else if ((m = line.match(/^[-*+]\s+(.+)$/))) {
      if (!inUl) { closeList(); out.push('<ul>'); inUl = true; }
      out.push(`<li>${m[1]}</li>`);
    } else if ((m = line.match(/^\d+[.、)]\s*(.+)$/))) {
      if (!inOl) { closeList(); out.push('<ol>'); inOl = true; }
      out.push(`<li>${m[1]}</li>`);
    } else {
      closeList();
      out.push(`<p>${line}</p>`);
    }
  }
  closeList();
  return out.join('')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

function pct(v) { return (v === null || v === undefined) ? '—' : Math.round(v * 100) + '%'; }

async function genReport(sid, btn) {
  if (btn) { btn.disabled = true; btn.textContent = 'AI 分析中…（约 10-20 秒）'; }
  try {
    const r = await fetch('/api/review/generate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sid })
    });
    const j = await r.json();
    if (!j.ok) { alert('生成失败：' + (j.error || '未知错误')); if (btn) { btn.disabled = false; btn.textContent = '生成 AI 复盘'; } return; }
    const u = j.usage || {};
    const est = (u.prompt_tokens || 0) / 1e6 * 1 + (u.completion_tokens || 0) / 1e6 * 4;
    $('meta').textContent = `本次报告 tokens ${u.prompt_tokens || 0}/${u.completion_tokens || 0} ≈ ${est.toFixed(4)} 元`;
    await boot();
    const box = $('rep-' + j.report_id);
    if (box) box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  } catch (e) {
    alert('出错：' + e);
    if (btn) { btn.disabled = false; btn.textContent = '生成 AI 复盘'; }
  }
}

async function delReport(rid) {
  if (!confirm('删除这份报告？（作答记录与练习日志不受影响）')) return;
  await fetch('/api/reports/' + rid, { method: 'DELETE' });
  boot();
}

function renderChart(trend) {
  const pts = (trend || []).filter(x => x.objective_rate !== null && x.objective_rate !== undefined).slice(-15);
  if (pts.length < 2) {
    $('chartBox').innerHTML = pts.length
      ? '<div class="note">目前只有 1 次有报告的练习，<b>还画不出趋势</b>——再做一次练习并生成报告即可对比。</div>'
      : '';
    return;
  }
  $('chartBox').innerHTML = `
    <div class="sum">
      <div style="font-size:14px;font-weight:600">客观题正确率趋势（最近 ${pts.length} 次有报告的练习）</div>
      <div class="chart">
        ${pts.map(p => {
          const v = Math.max(p.objective_rate * 100, 0);
          return `<div class="bar" title="${p.date} ${p.mode || ''}：客观 ${Math.round(v)}%">
            <div class="v">${Math.round(v)}</div>
            <div class="fill ${v < 60 ? 'bad' : ''}" style="height:${v}%"></div>
            <div class="d">${(p.date || '').slice(5)}</div>
          </div>`;
        }).join('')}
      </div>
      <div class="muted" style="margin-top:6px">纵轴＝客观题正确率（%）；红色＝低于 60%。</div>
    </div>`;
}

function renderItems(items) {
  if (!items.length) {
    $('list').innerHTML = `<div class="empty">还没有任何练习记录。<br><br>
      去 <a href="/">做一次模拟考试</a> 或 <a href="/daily">日常练习</a>，
      提交后回到这里就能生成 AI 复盘报告。</div>`;
    return;
  }
  $('list').innerHTML = items.map((it, idx) => {
    const m = it.metrics || {};
    const oRate = m.objective_rate !== null && m.objective_rate !== undefined
      ? m.objective_rate
      : (it.objective_total ? (it.objective_right || 0) / it.objective_total : null);
    const seq = items.length - idx;
    const snap = it.weak_snapshot || [];
    return `
    <div class="item" id="rep-${it.report_id || 's' + it.session_id}">
      <h3>#${seq} ${it.date}
        <span class="tag ${it.mode && it.mode.includes('模拟') ? 'sim' : ''}">${it.mode || '未标注'}</span>
        ${it.report_id ? '<span class="tag done">已生成报告</span>'
                       : '<span class="tag pending">未生成报告</span>'}
      </h3>
      <div class="tags">
        客观题 <span class="score">${it.objective_score ?? 0}</span> / ${(it.objective_total || 0) * 2} 分
        （对 ${it.objective_right || 0}/${it.objective_total || 0}，${pct(oRate)}）
        ｜ 主观自评 ${it.subjective_count || 0} 题
        ｜ 采分点命中 ${it.point_hits || 0}/${it.point_total || 0}
        ${it.note ? '｜ ' + it.note : ''}
      </div>
      ${it.report_id ? `
        <div class="report" id="content-${it.report_id}">${md(it.content)}</div>
        <div class="row">
          <button class="ghost mini" onclick="genReport(${it.session_id}, this)">重新生成</button>
          <button class="danger mini" onclick="delReport(${it.report_id})">删除报告</button>
          <span class="muted">生成于 ${(it.created_at || '').replace('T', ' ')}</span>
        </div>` : `
        <div class="row">
          <button onclick="genReport(${it.session_id}, this)">生成 AI 复盘</button>
          <span class="muted">用这一次的作答 + 历史记录生成学习报告</span>
        </div>`}
      ${snap.length ? `
      <details style="margin-top:8px">
        <summary>当时的薄弱点快照（前 ${snap.length} 个）</summary>
        <table>
          <tr><th>考点</th><th>命中/总</th><th>命中率</th></tr>
          ${snap.map(x => `<tr><td title="${x.path}">${x.name}</td>
            <td>${x.hit}/${x.total}</td>
            <td class="${x.rate < 0.6 ? 'rate-bad' : ''}">${Math.round(x.rate * 100)}%</td></tr>`).join('')}
        </table>
      </details>` : ''}
    </div>`;
  }).join('');
}

async function boot() {
  const r = await fetch('/api/reports?limit=200');
  const j = await r.json();
  const items = j.items || [], s = j.summary || {};
  if (!items.length) {
    $('sum').style.display = 'none';
    renderItems([]);
    return;
  }
  $('sum').style.display = 'block';
  $('meta').textContent = `练习 ${s.sessions || 0} 次 ｜ 报告 ${s.reports || 0} 份`;
  $('sum').innerHTML = `
    <div style="font-size:14px;font-weight:600">总览</div>
    <div class="kpi">
      <div>练习次数<b>${s.sessions || 0}</b></div>
      <div>已生成报告<b>${s.reports || 0}</b></div>
      <div>待生成<b>${s.pending || 0}</b></div>
      <div>累计客观题<b>${s.total_objective || 0}</b></div>
      <div>累计答对<b>${s.total_objective_right || 0}</b></div>
      <div>平均正确率<b>${pct(s.avg_objective_rate)}</b></div>
    </div>
    ${s.pending ? `<div class="note" style="margin:10px 0 0">有 ${s.pending} 次练习还没生成报告——点下面的「生成 AI 复盘」即可。</div>` : ''}`;
  renderChart(j.trend || []);
  renderItems(items);
}
boot();
</script>
</body>
</html>
